services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: vigia
      POSTGRES_USER: vigia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigia}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro,Z
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigia -d vigia"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    environment:
      Vigia__Region: ${REGION:-andalucia}
      ConnectionStrings__Vigia: Host=db;Port=5432;Database=vigia;Username=vigia;Password=${POSTGRES_PASSWORD:-vigia}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  ingest:
    build: ./ingest
    environment:
      REGION: ${REGION:-andalucia}
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:?Set FIRMS_MAP_KEY in .env}
      FIRMS_SOURCES: ${FIRMS_SOURCES:-VIIRS_SNPP_NRT,VIIRS_NOAA20_NRT}
      FIRMS_DAYS: ${FIRMS_DAYS:-2}
      INGEST_INTERVAL_SECONDS: ${INGEST_INTERVAL_SECONDS:-900}
      DATABASE_URL: postgresql://vigia:${POSTGRES_PASSWORD:-vigia}@db:5432/vigia
    volumes:
      - ./data:/data:ro,Z
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
